name: fyna

services:

  # ── Redis (cache de categorias do sistema) ───────────────────
  fyna-redis:
    image: redis:7-alpine
    container_name: fyna-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - fyna-redis-data:/data

  # ── Python AI Microservice ───────────────────────────────────
  fyna-ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: fyna-ai-engine
    ports:
      - "${FYNA_AI_PORT:-8081}:8081"
    environment:
      FYNA_AI_DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@host.docker.internal:${DB_PORT:-5432}/${DB_NAME}
      FYNA_AI_INTERNAL_API_KEY: ${FYNA_INTERNAL_KEY}
      FYNA_AI_DEBUG: "${FYNA_AI_DEBUG:-true}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Spring Boot Backend ──────────────────────────────────────
  fyna-back:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: fyna-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: fyna-redis
      REDIS_PORT: 6379
      FYNA_AI_ENGINE_URL: http://fyna-ai:8081
      FYNA_AI_INTERNAL_KEY: ${FYNA_INTERNAL_KEY}
      FYNA_CORS_ORIGINS: ${FYNA_CORS_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      fyna-ai:
        condition: service_started
      fyna-redis:
        condition: service_healthy

  # ── ngrok Tunnel (expõe fyna-back para internet) ─────────────
  fyna-ngrok:
    image: ngrok/ngrok:latest
    container_name: fyna-ngrok
    command: http --url=https://${NGROK_DOMAIN} fyna-back:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      fyna-back:
        condition: service_started

volumes:
  fyna-redis-data:
