spring:
  application:
    name: fyna-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA Configuration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    repair-on-migrate: true

# Server Configuration
server:
  port: ${SERVER_PORT:8080}

fyna:
  ai:
    engine-url: ${FYNA_AI_ENGINE_URL:http://localhost:8081}
    internal-api-key: ${FYNA_AI_INTERNAL_KEY:change-me-shared-internal-key}

  cors:
    # Prototipo local — aceita Flutter web e Swagger UI no localhost
    allowed-origins: ${FYNA_CORS_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:4200}

  rate-limit:
    auth:
      max-requests: ${FYNA_RATE_LIMIT_MAX:10}
      window-seconds: ${FYNA_RATE_LIMIT_WINDOW:60}

  circuit-breaker:
    failure-threshold: ${FYNA_CB_FAILURES:5}
    open-seconds: ${FYNA_CB_OPEN_SECONDS:60}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Logging Configuration
logging:
  level:
    root: INFO
    com.fyna: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-that-should-be-at-least-256-bits-long}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}      # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
