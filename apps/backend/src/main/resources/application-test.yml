spring:
  # Database Configuration - Test (Testcontainers)
  datasource:
    url: jdbc:tc:postgresql:16:///fyna_test_db
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  # JPA Configuration - Test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  # Redis Configuration - Test
  data:
    redis:
      host: localhost
      port: 6379

  # Flyway Configuration - Test
  flyway:
    clean-disabled: false
    clean-on-validation-error: true

# Logging Configuration - Test
logging:
  level:
    root: WARN
    com.fyna: DEBUG
    org.flywaydb: INFO
